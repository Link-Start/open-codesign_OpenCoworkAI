<!doctype html><html><head><style>html,body{margin:0;padding:0}.theme{color:rgb(12,34,56);font-size:18px;--surface:rgb(210,220,230)}.theme.alt{color:rgb(90,80,70);font-size:22px;--surface:rgb(200,190,180)}#cascade{color:inherit!important;background-color:var(--surface)!important;font-size:inherit!important}*{box-sizing:border-box}main{padding:12px}section{margin-bottom:14px}button{min-height:24px;padding:2px 6px}#controls{display:flex;flex-wrap:wrap;gap:4px}#flex{display:flex;width:300px;column-gap:12px;row-gap:8px;justify-content:flex-start}#flex button{flex:0 0 40px;height:30px;padding:0}#fa{order:2}#fb{order:1}#fc{order:3}#grid{display:grid;width:300px;grid-template-columns:80px 100px;grid-template-rows:30px 40px;grid-auto-rows:24px;column-gap:14px;row-gap:10px}#grid button{padding:0;min-height:0}#g3{grid-column:1 / span 2}#impostor{display:flex;grid-template-columns:80px 100px;gap:7px}#normal{display:flex}#normal button{width:20px;padding:0}#inner{width:180px;height:50px;overflow:auto}#inner-wide{width:1200px;height:100px}#clip{width:180px;height:20px;overflow:hidden}#clip-wide{width:1000px;height:10px}#overflow-probe{width:80px;height:10px;background:#888}#async{display:flex;gap:9px;width:200px}#async-a{width:31px;flex:none;padding:0}#async-b{width:20px;flex:none;padding:0}.override{display:block}@media(max-width:600px){#grid{grid-template-columns:120px}#g3{grid-column:auto}}</style></head><body><main><section id="cascade-parent" class="theme" role="group" aria-label="Cascade parent"><button id="cascade" style="color:rgb(1,2,3);background-color:red;font-size:9px">Cascade target</button></section><section id="flex" role="group" aria-label="Flex layout"><button id="fa">Flex A</button><button id="fb">Flex B</button><button id="fc">Flex C</button></section>
